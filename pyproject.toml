[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual-world-agent"
version = "0.1.0"
description = "LLM agent harness for a text-based grid world"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_world"]

[tool.hatch.build.targets.sdist]
include = ["src/virtual_world", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["virtual_world"]
