[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual-world-agent"
version = "0.4.0"
description = "LLM agent harness for a text-based grid world"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
llm = ["openai>=1.0", "anthropic>=0.40"]
dashboard = ["rich>=13.0"]
all = ["openai>=1.0", "anthropic>=0.40", "rich>=13.0"]
dev = ["pytest>=8.0", "mypy>=1.8", "rich>=13.0"]

[project.scripts]
vw-agent = "virtual_world.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_world"]

[tool.hatch.build.targets.sdist]
include = ["src/virtual_world", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["virtual_world"]
